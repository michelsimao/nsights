# `docker compose up --build` sobe tudo num clone limpo; um .env é opcional (ver .env.example).
name: riskops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riskops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskops}
      POSTGRES_DB: ${POSTGRES_DB:-riskops}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-riskops}:${POSTGRES_PASSWORD:-riskops}@db:5432/${POSTGRES_DB:-riskops}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-riskops}:${POSTGRES_PASSWORD:-riskops}@db:5432/riskops_test
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-prod}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-riskops123}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
