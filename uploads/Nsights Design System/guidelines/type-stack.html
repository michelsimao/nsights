<!DOCTYPE html>
<html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body { padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: baseline; gap: 16px; }
.row b { font-size: 26px; color: var(--ns-text-heading); font-weight: 500; }
.row span { font-size: 11px; color: var(--ns-text-muted); font-family: var(--ns-font-sans); }
</style></head>
<body>
<div class="row"><b style="font-family: var(--ns-font-sans);">Manrope</b><span>--ns-font-sans · UI, labels, botões, tabelas</span></div>
<div class="row"><b style="font-family: var(--ns-font-display);">Newsreader</b><span>--ns-font-display / --ns-font-serif · headings + prosa de relatórios</span></div>
<div class="row"><b style="font-family: var(--ns-font-mono); font-size: 22px;">JetBrains Mono</b><span>--ns-font-mono · código, dados tabulares</span></div>
</body></html>
