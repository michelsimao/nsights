<!-- @dsCard group="Colors" viewport="700x150" name="Borders & Shadows" subtitle="Hairline 1px borders; whisper-quiet shadows" -->
<!DOCTYPE html>
<html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.row { display: flex; gap: 12px; padding: 18px; }
.box { flex: 1; height: 96px; border-radius: 8px; background: var(--ns-bg-card); display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-size: 10.5px; color: var(--ns-text-muted); font-family: var(--ns-font-mono); }
</style></head>
<body>
<div class="row">
  <div class="box" style="border: 1px solid var(--ns-border);">border</div>
  <div class="box" style="border: 1px solid var(--ns-border-subtle);">subtle</div>
  <div class="box" style="border: 1px solid var(--ns-border-emphasis);">emphasis</div>
  <div class="box" style="border: 1px solid var(--ns-border-active);">active</div>
  <div class="box" style="box-shadow: var(--ns-shadow-md);">shadow-md</div>
  <div class="box" style="box-shadow: var(--ns-shadow-xl);">shadow-xl</div>
</div>
</body></html>
