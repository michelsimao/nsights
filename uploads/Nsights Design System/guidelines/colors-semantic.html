<!DOCTYPE html>
<html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.row { display: flex; gap: 10px; padding: 16px; }
.sw { flex: 1; height: 100px; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; }
.sw b { font-size: 11px; font-weight: 700; color: #0e0c09; }
.sw span { font-size: 10px; font-family: var(--ns-font-mono); color: rgba(14,12,9,0.65); }
</style></head>
<body>
<div class="row">
  <div class="sw" style="background: var(--ns-success);"><b>success</b><span>#6ce599</span></div>
  <div class="sw" style="background: var(--ns-warning);"><b>warning</b><span>#f0c962</span></div>
  <div class="sw" style="background: var(--ns-danger);"><b>danger</b><span>#f08368</span></div>
  <div class="sw" style="background: var(--ns-info);"><b>info</b><span>#e0b26a</span></div>
</div>
</body></html>
