<!-- @dsCard group="Colors" viewport="700x150" name="Backgrounds — Dark (default)" subtitle="Café warm dark — never pure black" -->
<!DOCTYPE html>
<html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.row { display: flex; gap: 10px; padding: 16px; }
.sw { flex: 1; height: 100px; border-radius: 8px; border: 1px solid var(--ns-border); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; }
.sw b { font-size: 11px; font-weight: 600; color: var(--ns-text-body); }
.sw span { font-size: 10px; font-family: var(--ns-font-mono); color: var(--ns-text-muted); }
</style></head>
<body>
<div class="row">
  <div class="sw" style="background: var(--ns-bg-base);"><b>base</b><span>#0e0c09</span></div>
  <div class="sw" style="background: var(--ns-bg-card);"><b>card</b><span>#1b1814</span></div>
  <div class="sw" style="background: var(--ns-bg-elevated);"><b>elevated</b><span>#262219</span></div>
  <div class="sw" style="background: var(--ns-bg-sidebar);"><b>sidebar</b><span>#0e0c09</span></div>
  <div class="sw" style="background: var(--ns-bg-hover);"><b>hover</b><span>cream 6%</span></div>
  <div class="sw" style="background: var(--ns-bg-active);"><b>active</b><span>lilac 10%</span></div>
</div>
</body></html>
