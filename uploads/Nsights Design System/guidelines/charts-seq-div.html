<!DOCTYPE html>
<html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.scale { display: flex; gap: 3px; height: 30px; }
.scale div { flex: 1; border-radius: 4px; }
.lbl { font-size: 10px; font-family: var(--ns-font-mono); color: var(--ns-text-muted); margin: -4px 0 0; }
</style></head>
<body>
<div class="scale">
  <div style="background:var(--ns-chart-seq-1)"></div><div style="background:var(--ns-chart-seq-2)"></div><div style="background:var(--ns-chart-seq-3)"></div><div style="background:var(--ns-chart-seq-4)"></div><div style="background:var(--ns-chart-seq-5)"></div><div style="background:var(--ns-chart-seq-6)"></div><div style="background:var(--ns-chart-seq-7)"></div><div style="background:var(--ns-chart-seq-8)"></div><div style="background:var(--ns-chart-seq-9)"></div><div style="background:var(--ns-chart-seq-10)"></div>
</div>
<p class="lbl">--ns-chart-seq-{1..10} · sequential</p>
<div class="scale">
  <div style="background:var(--ns-chart-div-1)"></div><div style="background:var(--ns-chart-div-2)"></div><div style="background:var(--ns-chart-div-3)"></div><div style="background:var(--ns-chart-div-4)"></div><div style="background:var(--ns-chart-div-5)"></div><div style="background:var(--ns-chart-div-6)"></div><div style="background:var(--ns-chart-div-7)"></div><div style="background:var(--ns-chart-div-8)"></div><div style="background:var(--ns-chart-div-9)"></div><div style="background:var(--ns-chart-div-10)"></div><div style="background:var(--ns-chart-div-11)"></div>
</div>
<p class="lbl">--ns-chart-div-{1..11} · diverging</p>
</body></html>
