<!DOCTYPE html>
<html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body { display: flex; margin: 0; }
.half { flex: 1; padding: 16px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.half div { display: flex; justify-content: space-between; }
.half span { font-family: var(--ns-font-mono); font-size: 10px; opacity: 0.6; }
</style></head>
<body>
<div class="half" style="background:#0e0c09">
  <div style="color:#f5f1e8; font-weight:600">Heading / body <span>#f5f1e8</span></div>
  <div style="color:#c9bfa8">Secondary <span>#c9bfa8</span></div>
  <div style="color:#b3a890">Muted <span>#b3a890</span></div>
  <div style="color:rgba(245,241,232,0.4)">Placeholder <span>40%</span></div>
  <div style="color:rgba(245,241,232,0.3)">Disabled <span>30%</span></div>
</div>
<div class="half" style="background:#f7f5f0">
  <div style="color:#1a1612; font-weight:600">Heading / body <span>#1a1612</span></div>
  <div style="color:#4a4035">Secondary <span>#4a4035</span></div>
  <div style="color:#7a6e60">Muted <span>#7a6e60</span></div>
  <div style="color:rgba(26,22,18,0.4)">Placeholder <span>40%</span></div>
  <div style="color:rgba(26,22,18,0.3)">Disabled <span>30%</span></div>
</div>
</body></html>
