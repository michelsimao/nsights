<!-- @dsCard group="Colors" viewport="700x170" name="Accents" subtitle="Amethyst/lilac primary + gold premium, both themes" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.half { display: flex; flex-direction: column; gap: 8px; flex: 1; padding: 14px; box-sizing: border-box; }
.half.dark { background: #0e0c09; border-radius: 0 8px 8px 0; }
.row { display: flex; gap: 8px; }
.sw { flex: 1; height: 46px; border-radius: 6px; }
.lbl { font-size: 9.5px; font-family: var(--ns-font-mono); display: flex; gap: 8px; justify-content: space-between; }
body { display: flex; margin: 0; }
</style></head>
<body>
<div class="half">
  <div class="row">
    <div class="sw" style="background:#6b3fd4"></div>
    <div class="sw" style="background:#5c35b5"></div>
    <div class="sw" style="background:#5429b8"></div>
    <div class="sw" style="background:#b8843c"></div>
  </div>
  <div class="lbl" style="color:#7a6e60"><span>primary #6b3fd4</span><span>secondary</span><span>tertiary</span><span>gold #b8843c</span></div>
  <div class="lbl" style="color:#7a6e60"><span>Light — deep amethyst</span></div>
</div>
<div class="half dark">
  <div class="row">
    <div class="sw" style="background:#ae7aff"></div>
    <div class="sw" style="background:#c09bff"></div>
    <div class="sw" style="background:#8e54e5"></div>
    <div class="sw" style="background:#e0b26a"></div>
  </div>
  <div class="lbl" style="color:#b3a890"><span>primary #ae7aff</span><span>secondary</span><span>tertiary</span><span>gold #e0b26a</span></div>
  <div class="lbl" style="color:#b3a890"><span>Dark — soft lilac</span></div>
</div>
</body></html>
